services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./HotelBookingSystem
      dockerfile: HotelBookingSystem.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=hotel_booking;Username=hotel;Password=hotel
      Jwt__Issuer: StayFinder
      Jwt__Audience: StayFinder
      Jwt__Key: local-development-signing-key-change-me-please-1234567890
      Jwt__ExpirationInMinutes: "120"
      Cors__AllowedOrigins__0: http://localhost:5173
      Admin__Email: admin@example.com
      Admin__Password: ChangeMe123!
    ports:
      - "5126:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./HotelBookingSystem
      dockerfile: HotelBookingSystem.Web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
